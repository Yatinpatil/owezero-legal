<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OweZero — Legal</title>
<style>
  :root { color-scheme: light dark; --bg:#f5fbf8; --surface:#ffffff; --text:#171d1b; --muted:#5f6b68; --border:#dae5e1; --accent:#006a60; --soft:#e8f5f1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1513; --surface:#1b2120; --text:#dee4e1; --muted:#a3b0ac; --border:#3f4946; --accent:#82d5c7; --soft:#16302b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px 16px; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.6; }
  main { max-width:560px; margin:0 auto; background:var(--surface); border:1px solid var(--border);
         border-radius:14px; padding:36px 28px; }
  h1 { font-size:26px; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 24px; }
  a { color:var(--accent); }
  a.row { display:block; padding:16px 18px; border:1px solid var(--border); border-radius:10px;
          margin-bottom:12px; font-weight:600; text-decoration:none; }
  a.row:hover { background:var(--soft); }
  footer { margin-top:24px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🧾 OweZero</h1>
  <p>Split trips, rent and dinners with friends, and settle up in fewer payments.</p>
  <a class="row" href="privacy-policy.html">Privacy Policy →</a>
  <footer>Contact: <a href="mailto:yatinp1@gmail.com">yatinp1@gmail.com</a> · Android package <code>com.yatinpatil.owezero</code></footer>
</main>
</body>
</html>
